# The Xbox 360 builds and their release:
#   xenon     LibXenon (Free60), onemustfall.elf32 for XeLL
#   xex       a normal title, onemustfall.xex (xsdk: openpak/x360-sdk)
#   stand-in  the same SDL drivers and layout built on Linux and run for 300
#             frames, to catch breakage without a console
# Each package is the "onemustfall" folder to copy to a USB stick, with an
# empty data/ for the player's own One Must Fall 2097 files. A v* tag also
# attaches both packages to the GitHub release. The same platform layer and
# pipeline as Meguarace and Raptua.
name: xbox360

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  xenon:
    name: Xbox 360 (LibXenon)
    runs-on: ubuntu-24.04
    container: free60/libxenon:latest
    steps:
      - name: Build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q cmake ninja-build git zip python3
      - uses: actions/checkout@v5
      - name: Configure
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cmake -S . -B build-xenon -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=platform/xenon/toolchain.cmake
      - name: Build
        run: cmake --build build-xenon
      - name: Package
        run: |
          mkdir -p pkg/onemustfall/data
          cp build-xenon/onemustfall.elf32 pkg/onemustfall/
          cp -r build-xenon/scripts pkg/onemustfall/scripts
          cp platform/xenon/README-360.txt pkg/onemustfall/README.txt
          cp platform/xenon/README-360.txt pkg/onemustfall/data/PUT-YOUR-OMF2097-FILES-HERE.txt
          (cd pkg && zip -qr ../onemustfall-xbox360-xell.zip onemustfall)
          ls -la build-xenon/onemustfall.elf32 onemustfall-xbox360-xell.zip
      - uses: actions/upload-artifact@v6
        with:
          name: onemustfall-xbox360-xell
          path: onemustfall-xbox360-xell.zip
          if-no-files-found: error

  xex:
    name: Xbox 360 title (xsdk, .xex)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # openpak/x360-sdk, pinned (the same as Meguarace and Raptua); its toolchain is
      # cached under ~/xsdk-gcc.
      XSDK_REF: bcbb0e7eeff4bae59f9882209e3edf5affc96767
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: openpak/x360-sdk
          ref: ${{ env.XSDK_REF }}
          path: xsdk
      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q ninja-build zip python3 \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev texinfo bison flex
      # Restored and saved as separate steps, so a toolchain once built is kept
      # even when a later step of the job fails.
      - name: Cached toolchain
        id: gcc
        uses: actions/cache/restore@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-gcc-${{ hashFiles('xsdk/tools/toolchain/**') }}
      - name: Build the toolchain (GCC, binutils, newlib; once)
        if: steps.gcc.outputs.cache-hit != 'true'
        run: |
          JOBS=$(nproc) bash xsdk/tools/toolchain/build.sh || { tail -n 80 ~/xsdk-gcc-work/logs/*.log; exit 1; }
      - name: Keep the toolchain
        if: steps.gcc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/xsdk-gcc
          key: xsdk-gcc-${{ hashFiles('xsdk/tools/toolchain/**') }}
      # Quit can launch another .xex (dashboard.txt): XamLoaderLaunchTitle,
      # xam.xex ordinal 0x1A4, which xsdk's import list doesn't have yet.
      - name: Add XamLoaderLaunchTitle to xsdk's imports
        run: |
          grep -q "XamLoaderLaunchTitle\b" xsdk/imports/imports.txt ||
            printf 'xam.xex       0x1A4  XamLoaderLaunchTitle\n' >> xsdk/imports/imports.txt
      - name: Build libxsdk
        run: make -C xsdk -j$(nproc) build/libxsdk.a
      - name: Configure
        run: |
          cmake -S . -B build-xex -G Ninja -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_TOOLCHAIN_FILE=$PWD/xsdk/cmake/xsdk.cmake -DXSDK_TOOLCHAIN=$HOME/xsdk-gcc
      - name: Build
        run: cmake --build build-xex
      - name: Package
        run: |
          mkdir -p pkg/onemustfall/data
          cp build-xex/onemustfall.xex pkg/onemustfall/onemustfall.xex
          mkdir -p pkg/onemustfall/aurora && cp assets/aurora/*.png pkg/onemustfall/aurora/
          cp platform/xenon/dashboard.txt pkg/onemustfall/dashboard.txt
          cp -r build-xex/scripts pkg/onemustfall/scripts
          cp platform/xenon/README-xex.txt pkg/onemustfall/README.txt
          cp platform/xenon/README-xex.txt pkg/onemustfall/data/PUT-YOUR-OMF2097-FILES-HERE.txt
          (cd pkg && zip -qr ../onemustfall-xbox360-xex.zip onemustfall)
          ls -la build-xex/onemustfall.xex onemustfall-xbox360-xex.zip
      - uses: actions/upload-artifact@v6
        with:
          name: onemustfall-xbox360-xex
          path: onemustfall-xbox360-xex.zip
          if-no-files-found: error

  stand-in:
    name: Xbox 360 stand-in (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: Build
        run: |
          cmake -S . -B build-sim -G Ninja -DCMAKE_BUILD_TYPE=Release -DOMF_XENON_SIM=ON
          cmake --build build-sim
      - name: Run 300 frames (no game data)
        run: |
          cd build-sim
          XENON_SIM_ROOT=$PWD/ XENON_SIM_SHOT="300:$PWD/frame300.bmp" XENON_SIM_FRAMES=300 timeout 120 ./onemustfall
          test -s frame300.bmp
          grep -q "OneMuastFall" onemustfall.log
      - uses: actions/upload-artifact@v6
        with:
          name: xbox360-stand-in-frame
          path: build-sim/frame300.bmp

  publish:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [xenon, xex, stand-in]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
