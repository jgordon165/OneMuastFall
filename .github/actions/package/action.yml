name: package
description: install the build into a staging folder and archive it (no game data)

inputs:
  name:
    description: archive base name, e.g. onemuastfall-windows-x64
    required: true
  configuration:
    required: false
    default: Release
  format:
    description: zip or tar.gz
    required: false
    default: zip

outputs:
  path:
    description: path of the archive
    value: ${{steps.archive.outputs.path}}

runs:
  using: "composite"
  steps:
    - name: Install to staging folder
      run: cmake --install build --config ${{inputs.configuration}} --prefix "stage/OneMuastFall"
      shell: bash

    # Packages hold the engine and its scripts only. Fail if anything that
    # looks like One Must Fall 2097 data got staged.
    - name: Check for game content
      run: |
        bad=$(find stage -type f \( -iname '*.bk' -o -iname '*.af' -o -iname '*.psm' -o -iname '*.pic' -o -iname '*.trn' -o -iname '*.dat' -o -iname '*.exe' -a ! -iname 'onemustfall.exe' \) )
        if [ -n "$bad" ]; then echo "game content in the package:"; echo "$bad"; exit 1; fi
      shell: bash

    - name: Archive
      id: archive
      run: |
        version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
        mkdir -p dist
        out="dist/${{inputs.name}}-$version.${{inputs.format}}"
        case "${{inputs.format}}" in
          zip)
            if command -v 7z >/dev/null; then (cd stage && 7z a -tzip "../$out" OneMuastFall >/dev/null)
            else (cd stage && zip -qr "../$out" OneMuastFall); fi ;;
          tar.gz) tar -C stage -czf "$out" OneMuastFall ;;
        esac
        echo "path=$out" >> "$GITHUB_OUTPUT"
        ls -l dist
      shell: bash
